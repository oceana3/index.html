<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Contact 💌</h1>
    <p>Une question, une recommandation de lecture ? Écris-moi !</p>
  </header>

  <main>
    <h2>Formulaire de contact</h2>

    <form action="#" method="post">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" placeholder="Ton nom" required>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>

      <label for="sujet">Sujet</label>
      <select id="sujet" name="sujet">
        <option>Recommandation de livre</option>
        <option>Question sur une lecture</option>
        <option>Autre</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Ton message..." required></textarea>

      <button type="submit">Envoyer</button>
    </form>

    <h2>Autres moyens de me contacter</h2>
    <p style="text-align:center">📧 bookclub.fictif@exemple.fr</p>
    <p style="text-align:center">📍 Brest, France (adresse fictive)</p>
  </main>

  <footer>
    <nav>
      <ul>
        <li><a href="index.html">Page d'accueil</a></li>
        <li><a href="Secondpages.html">Lectures du mois d'août</a></li>
        <li><a href="thirdpages.html">Thriller</a></li>
      </ul>
    </nav>
  </footer>

</body>
</html>
